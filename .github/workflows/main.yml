name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الخطوة دي هتصلح مشكلة rememberSaveable أوتوماتيكياً قبل البناء
    - name: Fix Kotlin Import Error
      run: |
        sed -i 's/import androidx.compose.runtime.\*/import androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable/g' app/src/main/java/com/legion/zone/ui/GameZoneScreen.kt || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: gradle assembleDebug

    # الخطوة دي هتاخد الـ APK وترفعهولك عشان تحمله
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LegionZone-APK
        path: '**/*.apk'
