name: Android Build

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout the code
  uses: actions/checkout@v4

- name: Set up JDK 17
  uses: actions/setup-java@v4
  with:
    java-version: '17'
    distribution: 'temurin'

# هذه الخطوة تقوم بإضافة السطر الناقص أوتوماتيكياً للملف قبل البناء
- name: Fix missing rememberSaveable import
  run: |
    sed -i 's/import androidx.compose.runtime.\*/import androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable/g' app/src/main/java/com/legion/zone/ui/GameZoneScreen.kt

- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v3

- name: Build with Gradle
  run: gradle assembleDebug

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: app-debug
    path: '**/build/outputs/apk/debug/*.apk'
