name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # استخدام gradle-build-action لتشغيل Gradle حتى لو لم يكن gradlew موجوداً
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # تشغيل أمر البناء مع تحديد المجلد الذي يحتوي على build.gradle.kts
    - name: Build with Gradle
      working-directory: ./LegionZone  # احذف هذا السطر أو عدله إلى ./ لو كان المشروع في الجذر
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
